name: macOS foundations

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional preview version to sign and validate without publishing
        type: string
        default: ''
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_version || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      # The runtime's macOS SQLite driver requires CGO.
      CGO_ENABLED: '1'
      GOWORK: 'off'
      RELEASE_VERSION: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies and check the native architecture
        run: |
          test "$(uname -m)" = arm64
          npm install --global pnpm@11.5.2
          pnpm install --frozen-lockfile
      - name: Go, UI and release-tool tests
        run: |
          go test ./... -timeout 5m
          go vet ./...
          pnpm test
          pnpm test:release
      - name: Production UI validation for PRs
        if: github.event_name == 'pull_request'
        run: pnpm build
      - name: Stamp the planned release version
        if: github.event_name != 'pull_request' && env.RELEASE_VERSION != ''
        run: node scripts/release.mjs stamp "$RELEASE_VERSION"
      - name: Restore pinned embedder and model
        if: github.event_name != 'pull_request'
        id: embedder-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            src-tauri/binaries/llama-server-aarch64-apple-darwin
            src-tauri/resources/models/
            .cache/llama-server-b11430-aarch64-apple-darwin
          key: macos-arm64-embedder-b11430-${{ hashFiles('scripts/build-embedder.sh') }}
      - name: Build native sidecars and embedding model
        if: github.event_name != 'pull_request'
        run: ./scripts/build-sidecars.sh
      - name: Cache the verified embedder
        if: github.event_name != 'pull_request' && steps.embedder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            src-tauri/binaries/llama-server-aarch64-apple-darwin
            src-tauri/resources/models/
            .cache/llama-server-b11430-aarch64-apple-darwin
          key: macos-arm64-embedder-b11430-${{ hashFiles('scripts/build-embedder.sh') }}
      - name: Identify Rust toolchain
        if: github.event_name != 'pull_request'
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust dependencies
        if: github.event_name != 'pull_request'
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
          key: macos-arm64-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-arm64-rust-${{ steps.rust.outputs.version }}-
      - name: Compile the desktop executable once
        if: github.event_name != 'pull_request'
        run: pnpm tauri build --no-bundle
      - name: Save Rust dependencies before integration checks
        if: github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
          key: macos-arm64-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Bundle and sign the compiled app and DMG
        if: github.event_name != 'pull_request'
        run: pnpm tauri bundle
      - name: Verify signatures and actual bundled services
        if: github.event_name != 'pull_request'
        run: |
          app=src-tauri/target/release/bundle/macos/Rex.app
          codesign --verify --deep --strict "$app"
          python3 scripts/macos-bundle-smoke.py "$app"
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            codesign --force --sign - "$dmg"
            codesign --verify "$dmg"
          done
      - name: Collect the versioned installer
        if: github.event_name != 'pull_request' && env.RELEASE_VERSION != ''
        run: |
          mkdir -p release-assets
          installers=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          cp "${installers[0]}" "release-assets/Rex-$RELEASE_VERSION-macos-arm64.dmg"
          node scripts/release.mjs manifest macos-arm64 "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request' && env.RELEASE_VERSION != ''
        with:
          name: rex-release-installer-macos-arm64-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request' && env.RELEASE_VERSION == ''
        with:
          name: rex-macos-arm64-development
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
