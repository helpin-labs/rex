name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rex-desktop-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install release tooling
        run: |
          npm install --global pnpm@11.5.2
          pnpm install --frozen-lockfile
          pnpm test:release
      - name: Plan semantic version and notes without publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.version != ''
        with:
          name: rex-release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, windows, macos]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rex-release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rex-release-installer-*
          path: release-assets
          merge-multiple: true
      - name: Require matching versions, source commits and installer checksums
        run: node scripts/release.mjs verify "$VERSION"
      - name: Create or resume the draft release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft,targetCommitish > existing-release.json; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' existing-release.json
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
          fi
      - name: Upload both verified installers and the public certificate
        run: gh release upload "v$VERSION" release-assets/*.exe release-assets/*.dmg release-assets/*.cer release-assets/SHA256SUMS --clobber
      - name: Publish the complete release
        run: gh release edit "v$VERSION" --draft=false
